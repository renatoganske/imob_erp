spring:
  application:
    name: imob-erp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/imobcrm}
    username: ${SPRING_DATASOURCE_USERNAME:imobuser}
    password: ${SPRING_DATASOURCE_PASSWORD:imobpass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

notification:
  email:
    from: ${MAIL_FROM:no-reply@imob-erp.local}

server:
  port: ${PORT:8080}

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId:-}]){faint} %clr([tenant=%X{tenantId:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

clerk:
  secret-key: ${CLERK_SECRET_KEY}
  jwks-url: ${CLERK_JWKS_URL}
  issuer: ${CLERK_ISSUER:}
  authorized-parties: ${CLERK_AUTHORIZED_PARTIES:${APP_CORS_ORIGIN:http://localhost:3000}}

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}

app:
  operator:
    api-key: ${OPERATOR_API_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ORIGIN:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
