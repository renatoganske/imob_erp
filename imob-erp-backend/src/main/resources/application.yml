spring:
  application:
    name: imob-erp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${jdbc:postgresql://localhost:5432/imoberp_db}
    username: ${SPRING_DATASOURCE_USERNAM:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

clerk:
  secret-key: ${CLERK_SECRET_KEY}
  jwks-url: ${CLERK_JWKS_URL}

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGIN:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
