spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  health:
    mail:
      # Com o Mailpit parado o health de e-mail deixava /actuator/health em DOWN, embora a API funcione.
      # Em producao o indicador continua ligado.
      enabled: false

logging:
  level:
    com.imobcrm: DEBUG
    org.hibernate.SQL: DEBUG

app:
  seed:
    # Dados de exemplo no tenant abaixo (idempotente). Desligue com APP_SEED_ENABLED=false.
    enabled: ${APP_SEED_ENABLED:true}
    tenant-slug: ${APP_SEED_TENANT_SLUG:imobiliaria-dev}
    admin-clerk-id: ${APP_SEED_ADMIN_CLERK_ID:}
